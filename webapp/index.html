<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Stock Move — Storage Location Transfer</title>

	<!-- PWA: installable home-screen app (icon, splash, standalone) -->
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#ffffff">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Stock Movement">
	<meta name="application-name" content="Stock Movement">
	<link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16.png">
	<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
	<link rel="apple-touch-icon" sizes="152x152" href="img/icons/icon-152.png">
	<link rel="apple-touch-icon" sizes="167x167" href="img/icons/icon-167.png">
	<link rel="apple-touch-icon" sizes="180x180" href="img/icons/icon-180.png">

	<!-- iOS launch (splash) screens, per device / orientation -->
	<link rel="apple-touch-startup-image" media="screen and (device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="img/splash/splash-ipad-10_2-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 1080px) and (device-height: 810px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="img/splash/splash-ipad-10_2-landscape.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="img/splash/splash-ipad-10_9-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 1180px) and (device-height: 820px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="img/splash/splash-ipad-10_9-landscape.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="img/splash/splash-ipad-pro-11-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 1194px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="img/splash/splash-ipad-pro-11-landscape.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="img/splash/splash-ipad-pro-12_9-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 1366px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="img/splash/splash-ipad-pro-12_9-landscape.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="img/splash/splash-iphone-8-se-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="img/splash/splash-iphone-13-14-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="img/splash/splash-iphone-15-promax-portrait.png">
	<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="img/splash/splash-iphone-mini-x-portrait.png">

	<!-- Register the service worker (required for Android to install/launch as a
	     standalone app). Needs a trusted HTTPS cert to register on Android. -->
	<script>
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", function () {
				navigator.serviceWorker.register("sw.js").catch(function (e) {
					console.warn("SW registration failed:", e);
				});
			});
		}
	</script>

	<style>
		html, body, #content {
			height: 100%;
			margin: 0;
		}
		/* stretch the root XML view so the Page fills the viewport */
		#content .sapUiView {
			height: 100%;
		}

		/* Use the device's native UI font instead of SAP "72" (!important so it
		   wins over the theme's own --sapFont* custom properties, which load
		   asynchronously after this block). SAP-icons keep their own font. */
		:root {
			--sapFontFamily: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, "Helvetica Neue", Arial, sans-serif !important;
			--sapFontHeaderFamily: var(--sapFontFamily) !important;
			--sapFontLightFamily: var(--sapFontFamily) !important;
			--sapFontBoldFamily: var(--sapFontFamily) !important;
			--sapFontSemiboldFamily: var(--sapFontFamily) !important;
			--sapFontSemiboldDuplexFamily: var(--sapFontFamily) !important;
		}

		/* top-left Kassim logo in the header (native 100x18 — keep it small so it
		   stays crisp; replace img/kassim-logo.png with a hi-res asset to enlarge) */
		.stmLogo { height: 1.15rem; width: auto; margin-right: 0.6rem; }
		.stmHeaderTitle { font-weight: 600; }

		/* prominent SAP-themed scan bar */
		.stmScanBar.sapMTB {
			min-height: 3rem;
			padding-top: 0.25rem;
			padding-bottom: 0.25rem;
			border-bottom: 3px solid var(--sapButton_Emphasized_Background, #0a6ed1);
			box-shadow: inset 0 3px 0 0 var(--sapButton_Emphasized_Background, #0a6ed1);
		}
		.stmScanBar .sapMLabel { font-weight: 600; }

		/* On phones the doff table collapses to popin (card-like) rows; give the
		   popped-in block a touch more breathing room so each row reads as a card. */
		.sapMListTblSubRow { padding-bottom: 0.25rem; }

		/* ---- Card / mockup styling ------------------------------------------- */
		#content { background: #f4f5f7; }

		/* header: give the two-line title room so it isn't clipped. The Bar's
		   left/right sections are a fixed 40px with overflow:hidden, which cuts
		   off the stacked title+subtitle — let them grow and not clip. */
		.sapMPageHeader { height: auto !important; }
		.stmHeaderBar.sapMBar { height: auto !important; min-height: 3.5rem; padding: 4px 0; }
		.stmHeaderBar .sapMBarLeft, .stmHeaderBar .sapMBarRight, .stmHeaderBar .sapMBarPH {
			overflow: visible !important; height: auto !important; align-items: center;
		}
		.stmHeaderBar .sapMBarLeft .sapMFlexBox { height: auto !important; }
		.stmHeaderTitle .sapMTitle, .stmHeaderTitle { font-size: 1rem; font-weight: 600; line-height: 1.15; margin: 0; }
		.stmHeaderSub .sapMText, .stmHeaderSub { line-height: 1.15; }
		/* on narrow phones keep the header one clean line: logo + title + status.
		   Hide the subtitle and collapse the SAP status to its icon only. */
		@media (max-width: 540px) {
			.stmHeaderSub { display: none !important; }
			.stmSap .sapMObjStatusText { display: none !important; }
			.stmSap.sapMObjStatus { padding: 4px 6px; }
		}
		.stmHeaderSub .sapMText, .stmHeaderSub { color: #8a8f98; font-size: 0.7rem; line-height: 1; }
		.stmSap.sapMObjStatus { padding: 2px 9px; border-radius: 20px; font-weight: 500; }
		.stmSap.sapMObjStatusSuccess { background: #e6f4ea; }
		.stmSap.sapMObjStatusWarning { background: #fdf3e5; }
		.stmSap.sapMObjStatusError   { background: #fdeaea; }

		/* panels -> rounded white cards */
		.stmCard.sapMPanel {
			background: #ffffff;
			border: 1px solid #e7e9ee;
			border-radius: 12px;
			box-shadow: none;
			overflow: hidden;
		}
		.stmCard > .sapMPanelWrappingDivTb, .stmCard .sapMPanelContent { background: transparent; }
		.stmCard .sapMPanelContent { border: none; padding: 0.5rem 0.75rem 0.75rem; }
		.stmScanCard.sapMPanel { border-top: 3px solid var(--sapButton_Emphasized_Background, #0a6ed1); }

		/* step header (icon + blue uppercase title) */
		.stmStepBar.sapMTB { background: transparent; border: none; min-height: 2.5rem; }
		.stmStepIcon { color: var(--sapButton_Emphasized_Background, #0a6ed1); font-size: 1rem; }
		.stmStepTitle .sapMTitle, .stmStepTitle {
			color: var(--sapButton_Emphasized_Background, #0a6ed1);
			text-transform: uppercase; letter-spacing: 0.05em;
			font-size: 0.72rem; font-weight: 600;
		}

		/* field labels + read-only chips */
		.stmFieldLbl .sapMLabel, .stmFieldLbl { color: #8a8f98; font-size: 0.7rem; }
		.stmChip .sapMInputBaseContentWrapper {
			background: #f1f3f5; border-color: transparent; border-radius: 8px;
		}
		.stmChip .sapMInputBaseInner { font-weight: 600; color: #22242a; }

		/* scan input (blue outline) */
		.stmScanInput .sapMInputBaseContentWrapper {
			border: 1.5px solid var(--sapButton_Emphasized_Background, #0a6ed1); border-radius: 8px;
		}

		/* doff meta line + green length box */
		.stmMeta .sapMText, .stmMeta { color: #5a5e66; font-size: 0.8rem; }
		.stmLen .sapMInputBaseContentWrapper {
			border: 1.5px solid var(--sapButton_Accept_Background, #107e3e); border-radius: 8px;
		}
		.stmLen .sapMInputBaseInner {
			color: var(--sapButton_Accept_Background, #107e3e); font-weight: 600; text-align: end;
		}
		.stmUom .sapMText, .stmUom { color: #8a8f98; font-size: 0.72rem; }

		/* full-width green Post bar */
		.stmPostBtn .sapMBtnInner { border-radius: 10px; height: 2.6rem; }
		.stmPostBtn .sapMBtnContent { font-weight: 600; }
	</style>

	<!-- Local QR decoder (jsQR, MIT) for the iPad camera scan button. -->
	<script src="lib/jsQR.js"></script>

	<!-- UI5 runtime is vendored locally at webapp/resources/ (OpenUI5 1.120.30,
	     gitignored ~540MB, third-party) so the app loads at LAN speed and needs
	     no internet. To fall back to the CDN, set src to
	     "https://sdk.openui5.org/1.120.30/resources/sap-ui-core.js". Re-create the
	     local runtime after a fresh clone with the command in the README. -->
	<script
		id="sap-ui-bootstrap"
		src="resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resourceroots='{"stock.transfer": "./"}'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true">
	</script>
</head>
<body class="sapUiBody">
	<div
		id="content"
		class="sapUiSizeCompact"
		data-sap-ui-component
		data-name="stock.transfer"
		data-id="container"
		data-height="100%"
		data-settings='{"id": "stockMoveApp"}'>
	</div>
</body>
</html>
