<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stock Move — Storage Location Transfer</title>

	<style>
		html, body, #content {
			height: 100%;
			margin: 0;
		}
		/* stretch the root XML view so the Page fills the viewport */
		#content .sapUiView {
			height: 100%;
		}

		/* Use the device's native UI font instead of SAP "72" (!important so it
		   wins over the theme's own --sapFont* custom properties, which load
		   asynchronously after this block). SAP-icons keep their own font. */
		:root {
			--sapFontFamily: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, "Helvetica Neue", Arial, sans-serif !important;
			--sapFontHeaderFamily: var(--sapFontFamily) !important;
			--sapFontLightFamily: var(--sapFontFamily) !important;
			--sapFontBoldFamily: var(--sapFontFamily) !important;
			--sapFontSemiboldFamily: var(--sapFontFamily) !important;
			--sapFontSemiboldDuplexFamily: var(--sapFontFamily) !important;
		}

		/* top-left Kassim logo in the header (native 100x18 — keep it small so it
		   stays crisp; replace img/kassim-logo.png with a hi-res asset to enlarge) */
		.stmLogo { height: 1.15rem; width: auto; margin-right: 0.6rem; }
		.stmHeaderTitle { font-weight: 600; }

		/* prominent SAP-themed scan bar */
		.stmScanBar.sapMTB {
			min-height: 3rem;
			padding-top: 0.25rem;
			padding-bottom: 0.25rem;
			border-bottom: 3px solid var(--sapButton_Emphasized_Background, #0a6ed1);
			box-shadow: inset 0 3px 0 0 var(--sapButton_Emphasized_Background, #0a6ed1);
		}
		.stmScanBar .sapMLabel { font-weight: 600; }

		/* On phones the doff table collapses to popin (card-like) rows; give the
		   popped-in block a touch more breathing room so each row reads as a card. */
		.sapMListTblSubRow { padding-bottom: 0.25rem; }
	</style>

	<!-- Local QR decoder (jsQR, MIT) for the iPad camera scan button. -->
	<script src="lib/jsQR.js"></script>

	<!-- UI5 runtime is vendored locally at webapp/resources/ (OpenUI5 1.120.30,
	     gitignored ~540MB, third-party) so the app loads at LAN speed and needs
	     no internet. To fall back to the CDN, set src to
	     "https://sdk.openui5.org/1.120.30/resources/sap-ui-core.js". Re-create the
	     local runtime after a fresh clone with the command in the README. -->
	<script
		id="sap-ui-bootstrap"
		src="resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resourceroots='{"stock.transfer": "./"}'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true">
	</script>
</head>
<body class="sapUiBody">
	<div
		id="content"
		class="sapUiSizeCompact"
		data-sap-ui-component
		data-name="stock.transfer"
		data-id="container"
		data-height="100%"
		data-settings='{"id": "stockMoveApp"}'>
	</div>
</body>
</html>
